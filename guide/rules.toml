# Stable ids for the MUST matrix of the Rust Super Guide (guide/rust-guide.md, version 1.3.0).
# enforcement: ci (a required job fails on a violation), review (reviewers check it; no tool does),
#   both (a tool catches part of it, review covers the rest), process (audited outside the code).
# exception: false means the exception register refuses entries for this rule; partial means only the
#   part the guide names (for example, no exception for `# Safety` in M11).
# checks: rust-policy jobs (fmt, clippy, test, doc, msrv, deny, miri) and conformance checks (Pnn).

guide_version = "1.3.0"

[M01]
title = "Formatting checked in CI"
enforcement = "ci"
exception = true
checks = ["fmt"]

[M02]
title = "Clippy clean in every supported configuration"
enforcement = "ci"
exception = true
checks = ["clippy"]

