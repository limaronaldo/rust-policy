# Managed by rust-policy: install.py writes this file and CI compares it with the release template.
# The job id "rust-policy" is part of the required check name "rust-policy / gate".
name: rust-policy

on:
  pull_request:
  merge_group:
  push:
    branches: [{default_branch}]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rust-policy-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-policy:
    permissions:
      contents: read
    uses: {policy_repo}/.github/workflows/rust-ci.yml@{policy_sha} # v{version}
