# Self-test of the policy repository itself: every pull request and every push to main.
name: self-test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  self-test:
    name: self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: "1.97.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain and test dependencies
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt --no-self-update
          sudo apt-get update -q && sudo apt-get install -y -q python3-yaml shellcheck
      - name: Install actionlint (Go module checksums verify the download)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install the cargo-deny version exercised by the tests
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2
      - run: tests/run.sh
